<svg viewBox="0 0 256 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F4E4A6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#DAA520;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8860B;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Base/Stand -->
  <ellipse cx="128" cy="260" rx="52" ry="12" fill="url(#goldGradient)" filter="url(#shadow)"/>
  <path d="M 90 260 L 98 240 L 158 240 L 166 260 Z" fill="url(#goldGradient)"/>
  <rect x="90" y="240" width="76" height="8" rx="2" fill="url(#goldGradient)"/>

  <!-- Neck/Shaft -->
  <path d="M 102 240 Q 102 180 128 140 Q 154 180 154 240" fill="url(#goldGradient)" filter="url(#shadow)"/>
  <ellipse cx="128" cy="140" rx="28" ry="12" fill="url(#goldGradient)"/>

  <!-- Crown Band -->
  <ellipse cx="128" cy="128" rx="38" ry="10" fill="url(#goldGradient)"/>
  <rect x="95" y="122" width="66" height="8" rx="2" fill="url(#goldGradient)"/>

  <!-- Second Crown Band -->
  <ellipse cx="128" cy="110" rx="36" ry="9" fill="url(#goldGradient)"/>
  <rect x="97" y="104" width="62" height="6" rx="1" fill="url(#goldGradient)"/>

  <!-- Left Prong -->
  <path d="M 105 115 Q 95 90 90 60 Q 88 50 92 48 Q 100 46 105 65 Q 110 90 115 110 Z" fill="url(#goldGradient)" filter="url(#shadow)"/>
  <circle cx="90" cy="55" r="8" fill="url(#goldGradient)"/>

  <!-- Center Prong (tallest) -->
  <path d="M 128 110 Q 128 80 130 40 Q 130 25 135 24 Q 140 23 140 45 Q 140 85 130 110 Z" fill="url(#goldGradient)" filter="url(#shadow)"/>
  <circle cx="133" cy="32" r="9" fill="url(#goldGradient)"/>

  <!-- Right Prong -->
  <path d="M 151 115 Q 161 90 166 60 Q 168 50 164 48 Q 156 46 151 65 Q 146 90 141 110 Z" fill="url(#goldGradient)" filter="url(#shadow)"/>
  <circle cx="166" cy="55" r="8" fill="url(#goldGradient)"/>

  <!-- Crown Front (top triangular part) -->
  <path d="M 100 125 L 128 85 L 156 125 Z" fill="url(#goldGradient)" filter="url(#shadow)"/>
</svg>