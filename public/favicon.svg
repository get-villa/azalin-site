<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F4E4A6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#DAA520;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8860B;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Dark background -->
  <rect width="128" height="128" fill="#0B1826"/>

  <!-- Base -->
  <ellipse cx="64" cy="104" rx="24" ry="6" fill="url(#goldGradient)"/>
  <rect x="48" y="98" width="32" height="5" rx="1" fill="url(#goldGradient)"/>

  <!-- Shaft -->
  <path d="M 54 98 Q 54 75 64 62 Q 74 75 74 98" fill="url(#goldGradient)"/>

  <!-- Crown Band -->
  <ellipse cx="64" cy="56" rx="16" ry="5" fill="url(#goldGradient)"/>

  <!-- Left Prong -->
  <path d="M 54 58 Q 48 42 44 28 L 47 27 Q 53 42 58 57 Z" fill="url(#goldGradient)"/>
  <circle cx="44" cy="25" r="4" fill="url(#goldGradient)"/>

  <!-- Center Prong -->
  <path d="M 64 56 Q 64 42 65 20 L 69 20 Q 69 42 66 56 Z" fill="url(#goldGradient)"/>
  <circle cx="66" cy="18" r="4.5" fill="url(#goldGradient)"/>

  <!-- Right Prong -->
  <path d="M 74 58 Q 80 42 84 28 L 81 27 Q 75 42 70 57 Z" fill="url(#goldGradient)"/>
  <circle cx="84" cy="25" r="4" fill="url(#goldGradient)"/>

  <!-- Crown top -->
  <path d="M 52 58 L 64 42 L 76 58 Z" fill="url(#goldGradient)"/>
</svg>
